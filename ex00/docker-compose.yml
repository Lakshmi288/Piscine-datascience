# Use postgres/example user/password credentials

services:
  postgres_db:
    container_name: postgres_db
    image: postgres:17-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_USER: lps
      POSTGRES_DB: piscineds
